; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
board_build.filesystem = littlefs
; The ESP is flashed through the Teensy serial passthrough, which drops Serial1 to
; ESPProgBaudRate (115200) in ESP Programming Mode. These must match.
upload_speed = 115200
build_flags =
    ; The Teensy <-> ESP link contract (shared/XCopyProtocol.h) is compiled into both
    ; firmware trees. The Teensy platformio.ini points at the same directory.
    -I ../shared
lib_deps = arduino-libraries/NTPClient@^3.1.0
