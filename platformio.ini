; PlatformIO Project Configuration File
;
;   Build options: build flags, extra scripting
;   Upload options: custom port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html
;
; ---------------------------------------------------------------------------------
; One project, two boards.
;
; The ESP8266 used to be a PlatformIO project of its own under esp8266/, which meant
; two platformio.ini files, two Project Tasks trees in the IDE, two copies of the
; Streaming library, and the shared link contract being reached through a different
; include path from each side. Both firmwares are now environments here, so one
; `pio run` builds the pair and the IDE lists them together.
;
; PlatformIO has no per environment src_dir, so both source trees live under the one
; it has and each environment filters down to its own half. The ESP sources moved to
; src/esp8266/ for that reason; only its web assets and its own libraries are still
; outside, and those are addressed by data_dir and lib_extra_dirs below.
;
; src_dir is deliberately left at its default rather than being pointed at the
; project root, which would be the other way to keep the two trees apart. That was
; tried and does not work here: the first build after a clean fails outright, with
; every FrameworkArduino object reporting "can't create ...o: No such file or
; directory" because the build directory is never made. A second run then succeeds,
; which makes it the kind of fault that looks like a flake and is not.
;
; Neither firmware is a .ino sketch any more. PlatformIO only turns a sketch into
; C++ when it sits at the top of src_dir, and with two trees under it neither one
; can. Both were renamed to .cpp; nothing inside them had to change, because each
; already defined every function before its first use.

[platformio]
; Only the ESP builds a filesystem image, so pointing this into its tree costs the
; Teensy environment nothing.
data_dir = esp8266/data
; The two firmwares and nothing else. Named explicitly because there is a third
; environment now - native, below - which has no board to build for and would fail
; a plain `pio run` if it were swept up in one.
default_envs = teensy31, d1_mini, d1_mini_ota

[env:teensy31]
platform = teensy@4.18.0
framework = arduino
board = teensy31
board_build.f_cpu = 96000000
; The ESP half of the tree, and the four ADFlib files this board has no use for.
; src/adflib/PATCHES.md says what each one is and what replaces it; keeping them
; vendored but unbuilt is what lets the tree stay a clean copy of the upstream tag.
build_src_filter =
    +<*>
    -<esp8266/>
    -<adflib/adflib.c>
    -<adflib/adf_debug.c>
    -<adflib/adf_dev_driver_dump.c>
    -<adflib/adf_dev_driver_ramdisk.c>
build_flags =
    ; -Os and newlib-nano as before, with link time optimisation on top. That is worth
    ; 12,376 bytes here - 97.2% of flash down to 92.4% - which is most of a year of
    ; headroom back for one word, and nothing else in the image comes close for the
    ; effort. It costs about ten seconds of build time.
    ;
    ; LTO can go wrong on this part in ways a successful link does not show, so the
    ; three that matter were checked against the non-LTO image byte for byte:
    ;
    ;   - The flash configuration field at 0x400 is unchanged (ff.. ff de f9 ff ff).
    ;     If FSEC there were ever optimised away or moved, the chip would come up
    ;     secured and the only way back would be a mass erase.
    ;   - The reset vector still points at ResetHandler.
    ;   - ftm0_flux_isr, ftm0_isr, ftm0_live_isr, uart0_status_isr and usb_isr all
    ;     survive at their own addresses. These override weak definitions in the core,
    ;     and the failure mode if LTO resolved them the other way is that the vector
    ;     table quietly points at unused_isr and the drive stops reading.
    ;
    ; What is not provable from the image is timing: the flux ISR is inlined
    ; differently under LTO, so a real read is the test.
    ;
    ; The build also warns twice about __cxa_guard_acquire/__cxa_guard_release being
    ; declared with mismatched types. That is the Teensy core disagreeing with its own
    ; header - cores/teensy3/new.h says __guard*, mk20dx128.c says char* - and is not
    ; something this project can fix or has any part in.
    -D TEENSY_OPT_SMALLEST_CODE_LTO
    ; ArduinoJson's number type. It defaults to double, and that default was the last
    ; thing on the board still pulling in the soft double runtime once XCopyFixed.h
    ; had taken the printing side away: parseNumber() and the serializer between them
    ; wanted __adddf3, __subdf3, __muldf3 and __divdf3, and nothing else did.
    ;
    ; Nothing here has ever needed the range. The only non integer the firmware stores
    ; is the audio volume, which is a float either side of the JSON, so double was only
    ; ever a wider staging post between two floats. Every volume the menu can reach
    ; round trips exactly with this set, and the config file it writes is tidier for
    ; it: "volume":0.8 rather than "volume":0.800000012. Files written by an older
    ; build read back the same, since 0.800000012 is the same float.
    -D ARDUINOJSON_USE_DOUBLE=0
    ; The Teensy <-> ESP link contract (shared/XCopyProtocol.h) is compiled into both
    ; environments, and now from the same path in both.
    -I shared
    ; 4KB Serial1 RX ring. Must exceed XFER_CHUNK so an SD write stall can never
    ; overrun the UART. Being >255 also widens rx_buffer_head/tail to uint16_t in
    ; serial1.c, which addMemoryForRead() alone does NOT do.
    -D SERIAL1_RX_BUFFER_SIZE=4096
    ; ADFlib asserts in ten of its files, all of them consistency checks on data
    ; read off a disk - which this firmware would rather report than abort on. Each
    ; also costs its file name and line number in flash.
    -D NDEBUG
    ; Which POSIX string helpers this toolchain has, which is what ADFlib's
    ; config.h would carry if it were generated. newlib on arm-none-eabi declares
    ; all three; without these, adf_util.c compiles its own and they collide.
    -D HAVE_STRNLEN
    -D HAVE_STRNDUP
    -D HAVE_STPNCPY

[env:d1_mini]
platform = espressif8266
framework = arduino
board = d1_mini
board_build.filesystem = littlefs
; 2MB of the D1 mini's 4MB for the web assets, up from the 1MB default.
;
; data/ is around 730KB but LittleFS rounds every file up to an 8KB block, so the
; 1MB partition ran out with the directory only two thirds full - adding one small
; script to it failed with "File system is full" and silently dropped the file from
; the image. The firmware is under 400KB, so the space is there for the taking.
;
; Changing this moves the partition boundary: the ESP needs both a firmware flash
; and a filesystem upload after it, not just one of the two.
;
; The bulk of the assets is data/index.html, which is ~150KB of hand written markup
; for the disk monitor hex view - 16 rows of 3000 characters that buildTrackGrid()
; style generation would remove entirely. Worth doing, but not from here.
board_build.ldscript = eagle.flash.4m2m.ld
; The ESP is flashed through the Teensy serial passthrough, which drops Serial1 to
; ESPProgBaudRate (115200) in ESP Programming Mode. These must match.
upload_speed = 115200
build_src_filter = +<esp8266/>
; The ESP only libraries stay outside src/ rather than moving into a lib/ shared
; with the Teensy, where the dependency finder would scan them on every Teensy
; build too.
lib_extra_dirs = esp8266/lib
; espota_fs_flag repairs the uploadfsota target, which the platform leaves unable
; to send a filesystem image - a one line gap with a misleading failure. Harmless
; on serial uploads, which never reach it.
;
; uploadall adds a task that sends the firmware and then the web assets, since
; the platform has no target that does both.
extra_scripts =
    post:scripts/espota_fs_flag.py
    post:scripts/uploadall.py
build_flags =
    -I shared
lib_deps = arduino-libraries/NTPClient@^3.1.0

; The same ESP firmware, pushed over Wi-Fi instead of through the Teensy.
;
; A separate environment rather than upload_protocol on d1_mini itself, because the
; serial passthrough has to stay reachable: it is the only way back in when an
; update leaves the ESP unable to join a network, and OTA cannot fix that.
;
; Both halves come this way. `upload` sends the sketch; `uploadfs` sends the
; LittleFS image the whole web interface is served from, which is the half that
; actually changes often. PlatformIO appends espota's filesystem flag for the
; uploadfs target on its own, so the target is the only thing to get right.
;
; The sketch is staged into free flash and copied on reboot, so it needs its own
; size free - 379KB against roughly 1.7MB spare. The filesystem is written
; straight into its partition and needs no staging room at all, which is why a 2MB
; image is not a problem on a 4MB part.
[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
; The device's name on the network. espota hands this straight to a socket, so
; anything the host can resolve works - a DNS name like this one, the mDNS name the
; firmware announces (xcopy.local), or a bare IP address.
upload_port = xcopy.lab

; The console interpreter and the fixed point formatter, tested on the host.
;
;     pio test -e native
;
; The five files below depend on nothing but Arduino's String: the terminal and the
; SD card reach them as function pointers, which is what XCopyConsoleIO.h is for.
; So test/shim/Arduino.h is the whole of the environment they need, and the tests
; run against the real sources rather than against copies of them. XCopyFixed.h is
; here on the same terms, and needs no entry above because it is header only.
;
; Nothing that needs hardware is here and nothing that needs hardware can be. What
; is here is what is hardest to check by hand on the device: every shape a command
; line can take, every error path, and the corners of the completer and the editor.
[env:native]
platform = native
test_framework = unity
; The sources under test are in src/, so the test build has to reach into it - and
; then take only the files that will compile without a board. That they do is the
; property this environment exists to keep true: everything here depends on nothing
; but Arduino's String.
test_build_src = yes
build_src_filter =
    -<*>
    +<XCopy/XCopyCommandTable.cpp>
    +<XCopy/XCopyArgs.cpp>
    +<XCopy/XCopyLineEditor.cpp>
    +<XCopy/XCopyComplete.cpp>
    +<XCopy/XCopyAdfPath.cpp>
build_flags =
    -std=c++11
    -I test/shim
    -I src/XCopy
; The console suite and the fixed point formatter. The ADF suite is the environment
; below, because the five files above are deliberately the whole of what this one
; compiles - that is the property being asserted, and adding a library to it would
; quietly retire it. test_fixed does not weaken that: XCopyFixed.h is header only and
; wants nothing but String, which is the same bar every source in the list clears.
test_filter = test_cli, test_fixed


; ADFlib, tested on the host.
;
;     pio test -e native_adf
;
; The library builds for a host with no changes, so the file system logic - format,
; mount, create, write, read back, delete, and the free block accounting underneath
; all of it - can be checked without a Teensy, an SD card or a floppy in the drive.
; None of that is reachable from the device except by trying it on real hardware and
; looking at what came out.
;
; Three files of ours are in here as well. XCopyAdfWalk is the streaming directory
; iterator the console lists through and XCopyAdfCopy is the file copy, both plain C
; over ADFlib for exactly this reason - the copy especially, since it is the part
; that writes and there is no other way to see whether what arrived is intact.
; adf_host.c answers the one thing the library asks of its host, the wall clock,
; with a fixed date, so an image written by the tests is reproducible.
;
; The device drivers are NOT here and cannot be: XCopyAdfSdDriver needs SdFat. What
; is tested instead is the contract it implements, through upstream's dump driver,
; which is the same vtable over stdio.
[env:native_adf]
platform = native
test_framework = unity
test_build_src = yes
test_filter = test_adf
build_src_filter =
    -<*>
    +<adflib/>
    +<XCopy/XCopyAdfWalk.c>
    +<XCopy/XCopyAdfCopy.c>
build_flags =
    -I src/adflib
    -I src/XCopy
    -Wall
    ; MinGW declares these two and not strndup or stpncpy, so ADFlib compiles its
    ; own for the other two. See src/adflib/config.h.
    -D HAVE_STRNLEN
    -D HAVE_MEMPCPY
